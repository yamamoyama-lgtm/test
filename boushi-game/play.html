<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ぼうしのヒーローの大冒険</title><style>html,body,#game{margin:0;width:100%;height:100%;border:0;background:#07131d}body{overflow:hidden}</style></head><body><iframe id="game" src="index.html"></iframe><script>const frame=document.getElementById('game');async function imgData(name){const t=await fetch(name+'.b64?2').then(r=>r.text());return 'data:image/jpeg;base64,'+t.trim()}frame.addEventListener('load',async()=>{const d=frame.contentDocument;const [hero,enemy,boss]=await Promise.all([imgData('hero'),imgData('enemy'),imgData('boss')]);const hs=d.querySelector('.herochar');if(hs){const im=d.createElement('img');im.src=hero;im.id='heroart';im.style.cssText='max-width:95%;max-height:95%;object-fit:contain;filter:drop-shadow(0 8px 5px #0008);border-radius:8px';hs.replaceWith(im)}const es=d.getElementById('echar');if(es){const im=d.createElement('img');im.id='echar';im.src=enemy;im.className=es.className;im.style.cssText='max-width:95%;max-height:95%;object-fit:contain;filter:drop-shadow(0 8px 5px #0008);border-radius:8px';es.replaceWith(im);const ob=new MutationObserver(()=>{im.src=im.className.includes('bosschar')?boss:enemy});ob.observe(im,{attributes:true,attributeFilter:['class']})}const st=d.createElement('style');st.textContent='.pic img{max-width:95%!important;max-height:95%!important;width:auto!important;height:auto!important}.pic .char:after{content:none!important}';d.head.appendChild(st)})</script></body></html>
