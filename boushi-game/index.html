<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><title>ぼうしのヒーローの大冒険</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#07131d;color:#fff;font-family:-apple-system,sans-serif;min-height:100dvh}#app{max-width:850px;margin:auto;padding:8px}header{display:flex;justify-content:space-between;padding:10px;background:#101820;border:2px solid #657;border-radius:12px}h1{font-size:18px;margin:0}.stage{color:#ffd84c;font-weight:bold}.arena{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:7px}.card{background:#101820;border:2px solid #59656b;border-radius:13px;padding:8px}.name{text-align:center;font-weight:bold}.pic{height:220px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}.char{font-size:100px;filter:drop-shadow(0 8px 5px #0008);user-select:none}.herochar:after{content:'🎩';font-size:100px}.enemychar:after{content:'🧙';font-size:100px}.bosschar:after{content:'🧙‍♂️';font-size:110px;filter:hue-rotate(170deg)}.barrow{display:grid;grid-template-columns:25px 1fr 62px;gap:5px;align-items:center;font-size:11px;margin-top:5px}.bar{height:13px;background:#111;border:1px solid #888;border-radius:9px;overflow:hidden}.fill{height:100%;transition:.25s}.hp{background:#ef3d49}.mp{background:#238dff}.status{text-align:center;color:#ffd37b;font-size:11px;height:18px}.bottom{display:grid;grid-template-columns:1fr 1.3fr;gap:7px;margin-top:7px}.log{height:210px;overflow:auto;font-size:13px;line-height:1.5}.log b{color:#ffd84c}.skills{display:grid;grid-template-columns:1fr 1fr;gap:6px}.skill{border:2px solid #626d6c;background:#172027;color:#fff;border-radius:10px;padding:9px;text-align:left;min-height:59px;touch-action:manipulation}.skill:active{background:#34424c;transform:scale(.98)}.skill:disabled{opacity:.35}.skill strong{display:block}.skill small{color:#aee2ff}.ult{border-color:#a64eff}.heal{border-color:#45ad65}.overlay{display:none;position:fixed;inset:0;background:#000d;z-index:10;align-items:center;justify-content:center;padding:20px}.overlay.show{display:flex}.modal{max-width:420px;width:100%;background:#101a22;border:2px solid #75827f;border-radius:16px;padding:20px;text-align:center}.modal button{width:100%;padding:14px;border:0;border-radius:10px;background:#7350d8;color:#fff;font-size:17px;font-weight:bold}.float{position:absolute;left:50%;top:50%;font-size:28px;font-weight:bold;animation:f .8s forwards}@keyframes f{to{transform:translate(-50%,-65px);opacity:0}}@media(max-width:650px){h1{font-size:14px}.pic{height:170px}.char{font-size:80px}.bottom{grid-template-columns:1fr}.log{height:90px}.skill{min-height:54px;padding:7px;font-size:12px}}</style></head><body><div id="app"><header><h1>ぼうしのヒーローの大冒険</h1><div id="stage" class="stage"></div></header><div class="arena"><div class="card"><div class="name">ぼうしのヒーロー</div><div class="pic" id="hpic"><span class="char herochar"></span></div><div class="barrow"><b>HP</b><div class="bar"><div id="hhp" class="fill hp"></div></div><span id="hhpt"></span></div><div class="barrow"><b>MP</b><div class="bar"><div id="hmp" class="fill mp"></div></div><span id="hmpt"></span></div><div id="hst" class="status"></div></div><div class="card"><div id="ename" class="name"></div><div class="pic" id="epic"><span id="echar" class="char enemychar"></span></div><div class="barrow"><b>HP</b><div class="bar"><div id="ehp" class="fill hp"></div></div><span id="ehpt"></span></div><div class="barrow"><b>MP</b><div class="bar"><div id="emp" class="fill mp"></div></div><span id="empt"></span></div><div id="est" class="status"></div></div></div><div class="bottom"><div class="card log" id="log"></div><div class="card skills"><button class="skill" data-a="slash"><strong>⚔ スラッシュ</strong><small>MP 0　通常攻撃</small></button><button class="skill" data-a="shot"><strong>✦ マジックショット</strong><small>MP 6　魔法攻撃</small></button><button class="skill" data-a="fire"><strong>🔥 ファイアボール</strong><small>MP 9　強攻撃＋やけど</small></button><button class="skill" data-a="wind"><strong>🌀 かぜおこし</strong><small>MP 8　2回攻撃</small></button><button class="skill" data-a="guard"><strong>🛡 ダークバリア</strong><small>MP 7　ダメージ半減</small></button><button class="skill heal" data-a="heal"><strong>♥ ヒール</strong><small>MP 10　HP回復</small></button><button class="skill" data-a="focus"><strong>◉ 魔力集中</strong><small>MPを14回復</small></button><button class="skill ult" data-a="black"><strong>☯ ブラック・マジック</strong><small>MP 22　必殺技＋呪い</small></button></div></div></div><div class="overlay" id="ov"><div class="modal"><h2 id="mt"></h2><p id="mx"></p><button id="mb"></button></div></div><script>const W=[{name:'まほうつかい・見習い',hp:75,mp:25,atk:11},{name:'赤眼のまほうつかい',hp:100,mp:35,atk:14},{name:'まほうつかい・幻影',hp:125,mp:42,atk:16},{name:'深淵のまほうつかい',hp:150,mp:50,atk:19},{name:'大まほうつかい',hp:180,mp:60,atk:21},{name:'まおうウィズブルー',hp:280,mp:90,atk:25,boss:true}];let H,w=0,E,busy=false;const $=x=>document.getElementById(x),R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,C=(v,a,b)=>Math.max(a,Math.min(b,v));function fresh(){return{hp:220,mh:220,mp:70,mm:70,guard:false,curse:0,burn:0}}function msg(x){$('log').innerHTML+=x+'<br>';$('log').scrollTop=$('log').scrollHeight}function start(){let x=W[w];E={...x,mh:x.hp,mm:x.mp,curse:0,burn:0};busy=false;$('log').innerHTML='';$('echar').className='char '+(x.boss?'bosschar':'enemychar');msg(x.boss?'<b>最終決戦！ まおうウィズブルーが現れた！</b>':'<b>'+x.name+'</b> が現れた！');up()}function up(){let p=(a,b)=>C(a/b*100,0,100)+'%';$('stage').textContent=E.boss?'最終戦 BOSS':'連戦 '+(w+1)+' / 6';$('ename').textContent=E.name;$('hhp').style.width=p(H.hp,H.mh);$('hmp').style.width=p(H.mp,H.mm);$('ehp').style.width=p(E.hp,E.mh);$('emp').style.width=p(E.mp,E.mm);$('hhpt').textContent=H.hp+'/'+H.mh;$('hmpt').textContent=H.mp+'/'+H.mm;$('ehpt').textContent=E.hp+'/'+E.mh;$('empt').textContent=E.mp+'/'+E.mm;$('hst').textContent=[H.guard?'バリア':'',H.curse?'呪い':'',H.burn?'やけど':''].filter(Boolean).join('・');$('est').textContent=[E.curse?'呪い':'',E.burn?'やけど':''].filter(Boolean).join('・');let c={slash:0,shot:6,fire:9,wind:8,guard:7,heal:10,focus:0,black:22};document.querySelectorAll('.skill').forEach(b=>b.disabled=busy||H.mp<c[b.dataset.a])}function pop(q,t){let d=document.createElement('div');d.className='float';d.textContent=t;$(q+'pic').appendChild(d);setTimeout(()=>d.remove(),850)}function hit(t,n){if(t===H&&H.guard)n=Math.ceil(n/2);t.hp=C(t.hp-n,0,t.mh);pop(t===H?'h':'e','-'+n);up();return n}function act(a){if(busy)return;busy=true;H.guard=false;let pen=H.curse?.75:1,d=0;if(a==='slash'){d=hit(E,Math.round(R(22,31)*pen));msg('スラッシュ！ <b>'+d+'</b> ダメージ！')}if(a==='shot'){H.mp-=6;d=hit(E,Math.round(R(31,43)*pen));msg('マジックショット！ <b>'+d+'</b> ダメージ！')}if(a==='fire'){H.mp-=9;d=hit(E,Math.round(R(38,52)*pen));msg('ファイアボール！ <b>'+d+'</b> ダメージ！');if(Math.random()<.5){E.burn=2;msg('敵は <b>やけど</b> になった！')}}if(a==='wind'){H.mp-=8;let x=hit(E,Math.round(R(15,23)*pen)),y=hit(E,Math.round(R(15,23)*pen));msg('かぜおこし！ <b>'+(x+y)+'</b> ダメージ！')}if(a==='guard'){H.mp-=7;H.guard=true;msg('<b>ダークバリア</b>！ 次の攻撃を半減！')}if(a==='heal'){H.mp-=10;let n=Math.min(R(45,65),H.mh-H.hp);H.hp+=n;pop('h','+'+n);msg('ヒール！ HPを <b>'+n+'</b> 回復！')}if(a==='focus'){let n=Math.min(14,H.mm-H.mp);H.mp+=n;msg('魔力集中！ MPが <b>'+n+'</b> 回復！')}if(a==='black'){H.mp-=22;d=hit(E,Math.round(R(72,96)*pen));E.curse=3;msg('<b>ブラック・マジック！！</b> <b>'+d+'</b> ダメージ＋呪い！')}up();setTimeout(after,450)}function after(){if(E.hp<=0)return win();if(E.burn){E.burn--;hit(E,9);msg('やけどで 9 ダメージ！');if(E.hp<=0)return setTimeout(win,300)}if(H.curse)H.curse--;if(E.curse)E.curse--;setTimeout(enemy,350)}function enemy(){let pen=E.curse?.7:1,r=Math.random(),d;if(E.boss&&E.mp>=18&&r<.4){E.mp-=18;d=hit(H,Math.round(R(35,50)*pen));msg('<b>ブルー・ノヴァ！</b> '+d+' ダメージ！')}else if(E.mp>=10&&r<.45){E.mp-=10;d=hit(H,Math.round(R(E.atk+6,E.atk+14)*pen));msg('魔法弾！ '+d+' ダメージ！')}else if(E.mp>=8&&r>.8){E.mp-=8;H.curse=2;d=hit(H,Math.round(R(6,11)*pen));msg('弱体の呪い！ '+d+' ダメージ＋呪い！')}else{d=hit(H,Math.round(R(E.atk-4,E.atk+5)*pen));msg('杖の攻撃！ '+d+' ダメージ！')}H.guard=false;E.mp=Math.min(E.mm,E.mp+4);up();setTimeout(()=>{if(H.hp<=0)lose();else{busy=false;up()}},450)}function modal(t,x,b,f){$('mt').textContent=t;$('mx').innerHTML=x;$('mb').textContent=b;$('mb').onclick=()=>{$('ov').classList.remove('show');f()};$('ov').classList.add('show')}function win(){busy=true;if(w===W.length-1)return modal('完全勝利！','まおうウィズブルーを倒した！<br><b>6連戦クリア！</b>','もう一度遊ぶ',()=>{H=fresh();w=0;start()});modal('勝利！',E.name+'を倒した！<br>HP+35 / MP+15 回復。','次の戦いへ',()=>{w++;H.hp=Math.min(H.mh,H.hp+35);H.mp=Math.min(H.mm,H.mp+15);start()})}function lose(){busy=true;modal('ゲームオーバー','第'+(w+1)+'戦で力尽きた……。','最初から再挑戦',()=>{H=fresh();w=0;start()})}document.querySelectorAll('.skill').forEach(b=>b.addEventListener('click',()=>act(b.dataset.a)));H=fresh();start();</script></body></html>
